name: Windows installer

on:
  workflow_dispatch:
    inputs:
      release:
        description: Version tag to publish as a release (e.g. v0.1.0); blank builds only
        required: false
        default: ""
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # transcribe.cpp v0.3.1 native build (see .gitignore)
      - name: Fetch native DLLs
        shell: bash
        run: |
          curl -sSLo native.tar.gz https://github.com/handy-computer/transcribe.cpp/releases/download/v0.3.1/transcribe-native-0.3.1-windows-x86_64-cpu-vulkan.tar.gz
          mkdir -p native-x
          tar -xzf native.tar.gz -C native-x
          cp native-x/*/*.dll src-tauri/native/

      - run: cargo test -p mahdar-core -p mahdar-brain

      - run: npm ci

      - run: npx tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: Mahdar-setup
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error

      # A version tag (e.g. v0.1.0), pushed or given to a manual run, publishes the
      # installer as a GitHub Release; a manual run creates the tag on this commit.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: target/release/bundle/nsis/*.exe
