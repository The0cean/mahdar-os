[package]
name = "mahdar"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Mahdar: local Arabic/English meeting transcription and minutes"

[lib]
name = "mahdar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
mahdar-core = { path = "../crates/mahdar-core" }
mahdar-brain = { path = "../crates/mahdar-brain" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
axum = "0.8"
tokio = { version = "1", features = ["net", "process", "time"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "compression-gzip"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
local-ip-address = "0.6"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking"] }
tauri-plugin-updater = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_DataExchange", "Win32_UI_Shell"] }
